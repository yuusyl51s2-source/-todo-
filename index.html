<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo - タスク管理表</title>

  <!-- Google Fonts: M PLUS Rounded 1c -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       カラーパレット & ベーススタイル（濃い茶色文字 & 淡色ベージュ）
       ========================================================= */
    :root {
      --bg-main: #FAF8F5;          /* 全体背景: オフホワイト */
      --bg-card: #F2EBE1;          /* カード・枠背景: 薄ベージュ */
      --bg-card-sub: #E8DFD3;      /* 入力欄・サブカード背景: やや濃いめの薄ベージュ */
      
      --text-main: #3D312A;        /* メインテキスト: 濃いダークブラウン */
      --text-sub: #6B5B52;         /* サブテキスト・日付など: ブラウン */
      --text-muted: #8C7A70;       /* 補足・プレースホルダー: マイルドブラウン */
      --text-done: #9C8C83;        /* 完了線テキスト */

      --btn-bg: #8C7A70;           /* プライマリボタン背景 */
      --btn-text: #FFFFFF;         /* ボタン内白文字 */
      --btn-hover: #736359;
      --border-color: #DDD4C8;     /* 淡いボーダーライン */
      --border-focus: #B5A499;

      /* パステル・ペールトーンカラーセット */
      --cat-rose-bg: #F9ECEC; --cat-rose-border: #E8C8C8; --cat-rose-text: #6B3D3D;
      --cat-honey-bg: #FCF4E3; --cat-honey-border: #F0DAAD; --cat-honey-text: #6B5424;
      --cat-sage-bg: #EEF4EE; --cat-sage-border: #C6DBC6; --cat-sage-text: #3D5A3D;
      --cat-lavender-bg: #F3EEF8; --cat-lavender-border: #D8C8EA; --cat-lavender-text: #523D6B;
      --cat-mint-bg: #E8F5F1; --cat-mint-border: #BCE2D7; --cat-mint-text: #2D5A4E;
      --cat-apricot-bg: #FAF0E6; --cat-apricot-border: #F2D0B6; --cat-apricot-text: #6B422D;
      --cat-sky-bg: #EBF3F9; --cat-sky-border: #BCD6EA; --cat-sky-text: #2D526B;
      --cat-tea-bg: #F4EFEB; --cat-tea-border: #D3C5B8; --cat-tea-text: #5A4C44;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    body {
      background-color: var(--bg-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
    }

    /* 統一SVGアイコン用共通スタイル */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .icon svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: none;
      stroke: var(--text-main);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-sm svg { width: 0.85rem; height: 0.85rem; }
    .icon-sub svg { stroke: var(--text-sub); }
    .icon-white svg { stroke: #FFFFFF; }

    /* ---------------------------------------------------------
       ヘッダー・ワークスペース切替領域
       --------------------------------------------------------- */
    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      background: var(--bg-card);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(61, 49, 42, 0.03);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .workspace-selector-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .workspace-select {
      background: #FFFFFF;
      border: 1.5px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
      max-width: 200px;
    }

    .workspace-select:focus {
      border-color: var(--border-focus);
    }

    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: #FFFFFF;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--bg-card-sub);
    }

    .btn-icon-only {
      padding: 6px 8px;
      min-width: 34px;
      min-height: 34px;
    }

    .btn-primary {
      background: var(--btn-bg);
      color: var(--btn-text) !important;
      border: none;
    }

    .btn-primary:hover {
      background: var(--btn-hover);
    }

    .btn-danger {
      background: #FDF2F2;
      color: #903D3D !important;
      border-color: #F8D7D7;
    }

    .btn-danger:hover {
      background: #F8E5E5;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    /* ---------------------------------------------------------
       タスク入力カード
       --------------------------------------------------------- */
    .add-card {
      background: #FFFFFF;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(61, 49, 42, 0.02);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"], input[type="date"], select {
      padding: 7px 10px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.88rem;
      background: var(--bg-main);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    input[type="text"]:focus, input[type="date"]:focus, select:focus {
      border-color: var(--border-focus);
      background: #FFFFFF;
    }

    .input-title { flex: 1; min-width: 180px; }
    .input-cat { min-width: 130px; }
    .input-date { min-width: 130px; }
    .input-notify { min-width: 110px; }

    /* ---------------------------------------------------------
       フィルタータブ
       --------------------------------------------------------- */
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: thin;
    }

    .filter-tab {
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-tab.active {
      background: var(--btn-bg);
      color: #FFFFFF !important;
      border-color: var(--btn-bg);
    }

    /* ---------------------------------------------------------
       コンパクトタスクリスト表示
       --------------------------------------------------------- */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-item {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(61, 49, 42, 0.02);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .task-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(61, 49, 42, 0.04);
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--btn-bg);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .task-main-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .task-title {
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-all;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-done);
    }

    .cat-badge-mini {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      border: 1px solid transparent;
    }

    .task-sub-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .date-badge {
      font-size: 0.76rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .date-badge.urgent {
      color: #903D3D;
      font-weight: 700;
    }

    .date-badge.urgent svg { stroke: #903D3D; }

    .notify-badge {
      display: flex;
      align-items: center;
      padding: 2px 5px;
      border-radius: 6px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
    }

    .task-item-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.75;
      transition: opacity 0.2s, background 0.2s;
    }

    .icon-btn:hover {
      opacity: 1;
      background: var(--bg-main);
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px dashed var(--border-color);
      font-size: 0.88rem;
    }

    /* ---------------------------------------------------------
       モーダル画面
       --------------------------------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(61, 49, 42, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #FFFFFF;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 20px 24px;
      box-shadow: 0 10px 30px rgba(61, 49, 42, 0.15);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .cat-edit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cat-edit-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-main);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .cat-edit-item input[type="text"] {
      flex: 1;
      padding: 4px 8px;
      background: #FFFFFF;
    }

    /* カラーテーマ定義 */
    .cat-color-rose { background-color: var(--cat-rose-bg); border-color: var(--cat-rose-border); color: var(--cat-rose-text); }
    .cat-color-honey { background-color: var(--cat-honey-bg); border-color: var(--cat-honey-border); color: var(--cat-honey-text); }
    .cat-color-sage { background-color: var(--cat-sage-bg); border-color: var(--cat-sage-border); color: var(--cat-sage-text); }
    .cat-color-lavender { background-color: var(--cat-lavender-bg); border-color: var(--cat-lavender-border); color: var(--cat-lavender-text); }
    .cat-color-mint { background-color: var(--cat-mint-bg); border-color: var(--cat-mint-border); color: var(--cat-mint-text); }
    .cat-color-apricot { background-color: var(--cat-apricot-bg); border-color: var(--cat-apricot-border); color: var(--cat-apricot-text); }
    .cat-color-sky { background-color: var(--cat-sky-bg); border-color: var(--cat-sky-border); color: var(--cat-sky-text); }
    .cat-color-tea { background-color: var(--cat-tea-bg); border-color: var(--cat-tea-border); color: var(--cat-tea-text); }

    textarea.json-textarea {
      width: 100%;
      height: 130px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      background: var(--bg-main);
      resize: vertical;
    }

    .trash-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
    }

    .trash-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      body { padding: 10px 6px; }
      .workspace-select { max-width: 150px; }
      .input-row { flex-direction: column; align-items: stretch; }
      .task-content { flex-direction: column; align-items: flex-start; gap: 4px; }
      .task-sub-info { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

<!-- SVG アイコン定義（濃い茶色一色） -->
<svg style="display: none;">
  <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></symbol>

  <symbol id="icon-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></symbol>
  <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></symbol>
  <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></symbol>
  <symbol id="icon-arrow-up" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></symbol>
  <symbol id="icon-arrow-down" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></symbol>

<!-- 過去のタスク名予測変換リスト -->
<datalist id="taskTitleHistoryList"></datalist>

<div class="app-container">
  <!-- ヘッダー＆タスク表切替領域 -->
  <header>
    <div class="top-bar">
      <div class="workspace-selector-wrapper">
        <select id="workspaceSelect" class="workspace-select" onchange="switchWorkspace(this.value)">
          <!-- 動的生成 -->
        </select>
        <button class="btn btn-icon-only" onclick="promptCreateWorkspace()" title="新規タスク表を作成">
          <span class="icon"><svg><use href="#icon-plus"/></svg></span>
        </button>
        <button class="btn btn-icon-only" onclick="openWorkspaceManageModal()" title="タスク表の設定・管理">
          <span class="icon"><svg><use href="#icon-settings"/></svg></span>
        </button>
      </div>

      <div class="header-actions">
        <button class="btn btn-icon-only" onclick="openTrashModal()" title="ゴミ箱（削除から1週間以内の復元）">
          <span class="icon"><svg><use href="#icon-trash"/></svg></span>
        </button>
        <button class="btn btn-icon-only" onclick="openCatManageModal()" title="カテゴリの編集・管理">
          <span class="icon"><svg><use href="#icon-tag"/></svg></span>
        </button>
        <button class="btn btn-icon-only" onclick="openDataModal()" title="データバックアップ・復元">
          <span class="icon"><svg><use href="#icon-refresh"/></svg></span>
        </button>
      </div>
    </div>
  </header>

  <!-- タスク入力カード -->
  <div class="add-card">
    <div class="input-group">
      <div class="input-row">
        <input type="text" id="taskTitle" class="input-title" list="taskTitleHistoryList" placeholder="やることを入力（過去の入力候補が出ます）..." onkeydown="if(event.key==='Enter') addTask()">
      </div>
      <div class="input-row">
        <select id="taskCategory" class="input-cat"></select>
        <input type="date" id="taskDueDate" class="input-date" title="期限日">
        <select id="taskNotifyEnable" class="input-notify" title="通知のオン/オフ">
          <option value="true"> 通知あり</option>
          <option value="false"> 通知なし</option>
        </select>
        <button class="btn btn-primary btn-icon-only" style="padding: 7px 14px;" onclick="addTask()" title="タスクを追加">
          <span class="icon icon-white"><svg><use href="#icon-plus"/></svg></span>
        </button>
      </div>
    </div>
  </div>

  <!-- フィルタータブ -->
  <div class="filter-tabs" id="filterTabs">
    <!-- 動的生成 -->
  </div>

  <!-- タスク一覧 -->
  <div class="task-list" id="taskList">
    <!-- 動的生成 -->
  </div>
</div>

<!-- モーダル：タスク完了確認用カスタムポップアップ -->
<div class="modal-overlay" id="completeConfirmModal">
  <div class="modal-card" style="max-width: 360px; text-align: center; padding: 24px;">
    <div style="font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main);">✨ タスクの完了確認</div>
    <p id="completeConfirmText" style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 20px; line-height: 1.4; white-space: pre-wrap;"></p>
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button class="btn" style="flex: 1;" onclick="closeCompleteConfirm(false)">いいえ</button>
      <button class="btn btn-primary" style="flex: 1;" onclick="closeCompleteConfirm(true)">はい（完了）</button>
    </div>
  </div>
</div>

<!-- モーダル：タスク編集 -->
<div class="modal-overlay" id="editTaskModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">
        <span class="icon"><svg><use href="#icon-edit"/></svg></span> タスクの編集
      </div>
      <button class="icon-btn" onclick="closeModal('editTaskModal')">
        <span class="icon"><svg><use href="#icon-close"/></svg></span>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editTaskId">
      <div class="form-group">
        <label>タスク名</label>
        <input type="text" id="editTaskTitle" list="taskTitleHistoryList" placeholder="タスク名を入力">
      </div>
      <div class="form-group">
        <label>カテゴリ</label>
        <select id="editTaskCategory"></select>
      </div>
      <div class="form-group">
        <label>期限日</label>
        <input type="date" id="editTaskDueDate">
      </div>
      <div class="form-group">
        <label>通知設定</label>
        <select id="editTaskNotifyEnable">
          <option value="true"> 通知あり（3日前19時＆当日朝5時）</option>
          <option value="false"> 通知なし</option>
        </select>
      </div>
    </div>
    <div style="margin-top: 16px; text-align: right;">
      <button class="btn btn-primary" onclick="saveTaskEdit()">変更を保存</button>
    </div>
  </div>
</div>

<!-- モーダル：ゴミ箱 -->
<div class="modal-overlay" id="trashModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">
        <span class="icon"><svg><use href="#icon-trash"/></svg></span> ゴミ箱（1週間以内の削除タスク）
      </div>
      <button class="icon-btn" onclick="closeModal('trashModal')">
        <span class="icon"><svg><use href="#icon-close"/></svg></span>
      </button>
    </div>
    <div class="modal-body" id="trashList">
      <!-- 動的生成 -->
    </div>
  </div>
</div>

<!-- モーダル：カテゴリ管理 -->
<div class="modal-overlay" id="catModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">
        <span class="icon"><svg><use href="#icon-tag"/></svg></span> カテゴリの編集・追加
      </div>
      <button class="icon-btn" onclick="closeModal('catModal')">
        <span class="icon"><svg><use href="#icon-close"/></svg></span>
      </button>
    </div>
    <div class="modal-body">
      <div class="cat-edit-list" id="catEditList">
        <!-- 動的生成 -->
      </div>
      <button class="btn" style="width: 100%; margin-top: 8px;" onclick="addNewCategoryField()">＋ 新しいカテゴリを追加</button>
    </div>
    <div style="margin-top: 16px; text-align: right;">
      <button class="btn btn-primary" onclick="saveCategories()">完了・保存</button>
    </div>
  </div>
</div>

<!-- モーダル：ワークスペース管理 -->
<div class="modal-overlay" id="wsModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">
        <span class="icon"><svg><use href="#icon-settings"/></svg></span> タスク管理表の設定
      </div>
      <button class="icon-btn" onclick="closeModal('wsModal')">
        <span class="icon"><svg><use href="#icon-close"/></svg></span>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>タスク表の名前:</label>
        <input type="text" id="wsNameInput" placeholder="例: プライベート、仕事、旅行準備">
      </div>
      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 8px 0;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.85rem; color: var(--text-sub);">このタスク表を削除:</span>
        <button class="btn btn-danger btn-sm" onclick="deleteCurrentWorkspace()">削除する</button>
      </div>
    </div>
    <div style="margin-top: 16px; text-align: right;">
      <button class="btn btn-primary" onclick="saveWorkspaceName()">保存</button>
    </div>
  </div>
</div>

<!-- モーダル：データ入出力 -->
<div class="modal-overlay" id="dataModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">
        <span class="icon"><svg><use href="#icon-refresh"/></svg></span> データの出力・取り込み
      </div>
      <button class="icon-btn" onclick="closeModal('dataModal')">
        <span class="icon"><svg><use href="#icon-close"/></svg></span>
      </button>
    </div>
    <div class="modal-body">
      <p style="font-size: 0.82rem; color: var(--text-sub);">
        すべてのタスク表・入力履歴・ゴミ箱データのバックアップ・復元を行えます。
      </p>
      <textarea id="jsonArea" class="json-textarea" placeholder="ここにバックアップデータを貼り付け..."></textarea>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn" onclick="copyDataText()">📋 コピー</button>
        <button class="btn btn-primary" onclick="importDataText()">📥 復元・読み込み</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* カラー定義 */
  const COLOR_OPTIONS = [
    { key: 'rose', name: 'ダスティローズ', class: 'cat-color-rose' },
    { key: 'honey', name: 'ハニーイエロー', class: 'cat-color-honey' },
    { key: 'sage', name: 'セージグリーン', class: 'cat-color-sage' },
    { key: 'lavender', name: 'ソフトラベンダー', class: 'cat-color-lavender' },
    { key: 'mint', name: 'ペパーミント', class: 'cat-color-mint' },
    { key: 'apricot', name: 'アプリコット', class: 'cat-color-apricot' },
    { key: 'sky', name: 'スカイブルー', class: 'cat-color-sky' },
    { key: 'tea', name: 'ミルクティー', class: 'cat-color-tea' }
  ];

  const DEFAULT_CATEGORIES = [
    { id: 'cat_1', name: '今すぐ・1週間', color: 'rose' },
    { id: 'cat_2', name: '2週間〜1ヶ月', color: 'honey' },
    { id: 'cat_3', name: '半年以内', color: 'sage' },
    { id: 'cat_4', name: '期限なし', color: 'lavender' }
  ];

  const STORAGE_KEY = 'pastel_multi_todo_app_data_v8';

  /* アプリ状態 */
  let appState = {
    currentWorkspaceId: 'default_ws',
    trash: [],
    historyTitles: ['部屋の掃除・片付け', '書類の整理と提出', '資格試験の勉強'],
    workspaces: {
      'default_ws': {
        id: 'default_ws',
        name: 'メインのタスク表',
        categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
        tasks: [
          { id: '1', title: '部屋の掃除・片付け', categoryId: 'cat_1', dueDate: getRelativeDateStr(2), notifyEnable: true, completed: false },
          { id: '2', title: '書類の整理と提出', categoryId: 'cat_2', dueDate: getRelativeDateStr(14), notifyEnable: true, completed: false },
          { id: '3', title: '資格試験の勉強', categoryId: 'cat_3', dueDate: getRelativeDateStr(90), notifyEnable: false, completed: false }
        ]
      }
    }
  };

  let activeFilter = 'ALL';
  let pendingCompleteTaskId = null;

  function getRelativeDateStr(addDays) {
    const d = new Date();
    d.setDate(d.getDate() + addDays);
    return d.toISOString().split('T')[0];
  }

  function init() {
    loadFromStorage();
    cleanOldTrash();
    requestNotificationPermission();
    renderWorkspaceSelect();
    renderCategorySelect();
    renderFilterTabs();
    renderHistoryDatalist();
    renderTasks();
    setInterval(checkNotifications, 30000);
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  }

  function loadFromStorage() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      try {
        const parsed = JSON.parse(data);
        if (parsed && parsed.workspaces) {
          appState = parsed;
          if (!appState.trash) appState.trash = [];
          if (!appState.historyTitles) appState.historyTitles = [];
        }
      } catch(e) { console.error(e); }
    }
  }

  function getCurrentWorkspace() {
    if (!appState.workspaces[appState.currentWorkspaceId]) {
      appState.currentWorkspaceId = Object.keys(appState.workspaces)[0] || 'default_ws';
    }
    return appState.workspaces[appState.currentWorkspaceId];
  }

  function renderHistoryDatalist() {
    const dl = document.getElementById('taskTitleHistoryList');
    dl.innerHTML = '';
    if (appState.historyTitles) {
      appState.historyTitles.forEach(title => {
        const opt = document.createElement('option');
        opt.value = title;
        dl.appendChild(opt);
      });
    }
  }

  function addTitleToHistory(title) {
    if (!title) return;
    if (!appState.historyTitles) appState.historyTitles = [];
    appState.historyTitles = appState.historyTitles.filter(t => t !== title);
    appState.historyTitles.unshift(title);
    if (appState.historyTitles.length > 50) appState.historyTitles.pop();
    renderHistoryDatalist();
  }

  function renderWorkspaceSelect() {
    const select = document.getElementById('workspaceSelect');
    select.innerHTML = '';
    Object.values(appState.workspaces).forEach(ws => {
      const opt = document.createElement('option');
      opt.value = ws.id;
      opt.textContent = ws.name;
      if (ws.id === appState.currentWorkspaceId) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function switchWorkspace(wsId) {
    if (appState.workspaces[wsId]) {
      appState.currentWorkspaceId = wsId;
      activeFilter = 'ALL';
      saveToStorage();
      renderCategorySelect();
      renderFilterTabs();
      renderTasks();
    }
  }

  function promptCreateWorkspace() {
    const name = prompt("新しいタスク管理表の名前を入力してください:", "新しいタスク表");
    if (name && name.trim()) {
      const newId = 'ws_' + Date.now();
      appState.workspaces[newId] = {
        id: newId,
        name: name.trim(),
        categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
        tasks: []
      };
      appState.currentWorkspaceId = newId;
      activeFilter = 'ALL';
      saveToStorage();
      renderWorkspaceSelect();
      renderCategorySelect();
      renderFilterTabs();
      renderTasks();
    }
  }

  function openWorkspaceManageModal() {
    document.getElementById('wsNameInput').value = getCurrentWorkspace().name;
    openModal('wsModal');
  }

  function saveWorkspaceName() {
    const ws = getCurrentWorkspace();
    const name = document.getElementById('wsNameInput').value.trim();
    if (name) {
      ws.name = name;
      saveToStorage();
      renderWorkspaceSelect();
      closeModal('wsModal');
    }
  }

  function deleteCurrentWorkspace() {
    if (Object.keys(appState.workspaces).length <= 1) {
      alert("これ以上タスク表を削除できません。");
      return;
    }
    const ws = getCurrentWorkspace();
    if (confirm(`タスク表「${ws.name}」を削除してもよろしいですか？`)) {
      delete appState.workspaces[ws.id];
      appState.currentWorkspaceId = Object.keys(appState.workspaces)[0];
      saveToStorage();
      renderWorkspaceSelect();
      renderCategorySelect();
      renderFilterTabs();
      renderTasks();
      closeModal('wsModal');
    }
  }

  function renderCategorySelect() {
    const ws = getCurrentWorkspace();
    const select = document.getElementById('taskCategory');
    select.innerHTML = '';
    ws.categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat.id;
      opt.textContent = cat.name;
      select.appendChild(opt);
    });
  }

  function renderFilterTabs() {
    const ws = getCurrentWorkspace();
    const container = document.getElementById('filterTabs');
    container.innerHTML = '';

    const allTab = document.createElement('button');
    allTab.className = `filter-tab ${activeFilter === 'ALL' ? 'active' : ''}`;
    allTab.textContent = `すべて (${ws.tasks.length})`;
    allTab.onclick = () => setFilter('ALL');
    container.appendChild(allTab);

    ws.categories.forEach(cat => {
      const count = ws.tasks.filter(t => t.categoryId === cat.id).length;
      const tab = document.createElement('button');
      tab.className = `filter-tab ${activeFilter === cat.id ? 'active' : ''}`;
      tab.textContent = `${cat.name} (${count})`;
      tab.onclick = () => setFilter(cat.id);
      container.appendChild(tab);
    });
  }

  function setFilter(catId) {
    activeFilter = catId;
    renderFilterTabs();
    renderTasks();
  }

  function sortTasksByDueDate(tasks) {
    return tasks.slice().sort((a, b) => {
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    });
  }

  function renderTasks() {
    const ws = getCurrentWorkspace();
    const listEl = document.getElementById('taskList');
    listEl.innerHTML = '';

    let filtered = ws.tasks;
    if (activeFilter !== 'ALL') {
      filtered = ws.tasks.filter(t => t.categoryId === activeFilter);
    }

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty-state">タスクはありません</div>`;
      return;
    }

    const sorted = sortTasksByDueDate(filtered);
    const todayStr = new Date().toISOString().split('T')[0];

    sorted.forEach(task => {
      const cat = ws.categories.find(c => c.id === task.categoryId) || { name: '未分類', color: 'tea' };
      const colorObj = COLOR_OPTIONS.find(c => c.key === cat.color) || COLOR_OPTIONS[0];

      const item = document.createElement('div');
      item.className = `task-item ${task.completed ? 'completed' : ''}`;

      let dateHtml = '';
      if (task.dueDate) {
        const isUrgent = !task.completed && task.dueDate <= todayStr;
        dateHtml = `
          <span class="date-badge ${isUrgent ? 'urgent' : ''}">
            <span class="icon icon-sm icon-sub"><svg><use href="#icon-calendar"/></svg></span>
            ${task.dueDate}
            ${isUrgent ? '<span class="icon icon-sm"><svg><use href="#icon-alert"/></svg></span>' : ''}
          </span>
        `;
      }

      let notifyHtml = '';
      if (task.dueDate && (task.notifyEnable === undefined || task.notifyEnable === true || task.notifyEnable === 'true')) {
        notifyHtml = `
          <span class="notify-badge" title="期限当日の朝5時・3日前夜19時に自動通知">
            <span class="icon icon-sm icon-sub"><svg><use href="#icon-bell"/></svg></span>
          </span>
        `;
      }

      item.innerHTML = `
        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onclick="triggerTaskToggle(event, '${task.id}')">
        <div class="task-content">
          <div class="task-main-info">
            <span class="cat-badge-mini ${colorObj.class}">${cat.name}</span>
            <span class="task-title" title="${escapeHtml(task.title)}">${escapeHtml(task.title)}</span>
          </div>
          <div class="task-sub-info">
            ${dateHtml}
            ${notifyHtml}
          </div>
        </div>
        <div class="task-item-actions">
          <button class="icon-btn" onclick="openEditTaskModal('${task.id}')" title="編集">
            <span class="icon icon-sm"><svg><use href="#icon-edit"/></svg></span>
          </button>
          <button class="icon-btn" onclick="deleteTask('${task.id}')" title="ゴミ箱へ移動">
            <span class="icon icon-sm"><svg><use href="#icon-trash"/></svg></span>
          </button>
        </div>
      `;

      listEl.appendChild(item);
    });
  }

  /* 確実にダイアログを出すクリック処理 */
  function triggerTaskToggle(event, id) {
    const ws = getCurrentWorkspace();
    const task = ws.tasks.find(t => t.id === id);
    if (!task) return;

    if (!task.completed) {
      // 未完了→完了にする時: デフォルトのチェック付けを一旦防止して確認ポップアップを表示
      event.preventDefault();
      pendingCompleteTaskId = id;
      document.getElementById('completeConfirmText').textContent = `「${task.title}」\n本当にこのタスクを完了にしますか？`;
      openModal('completeConfirmModal');
    } else {
      // 完了→未完了に戻す時
      task.completed = false;
      saveToStorage();
      renderTasks();
    }
  }

  /* ポップアップ応答処理 */
  function closeCompleteConfirm(isYes) {
    if (isYes && pendingCompleteTaskId) {
      const ws = getCurrentWorkspace();
      const task = ws.tasks.find(t => t.id === pendingCompleteTaskId);
      if (task) {
        task.completed = true;
        saveToStorage();
        renderTasks();
      }
    }
    pendingCompleteTaskId = null;
    closeModal('completeConfirmModal');
  }

  function addTask() {
    const ws = getCurrentWorkspace();
    const titleInput = document.getElementById('taskTitle');
    const catSelect = document.getElementById('taskCategory');
    const dateInput = document.getElementById('taskDueDate');
    const notifySelect = document.getElementById('taskNotifyEnable');

    const title = titleInput.value.trim();
    if (!title) return;

    addTitleToHistory(title);

    const newTask = {
      id: String(Date.now()),
      title: title,
      categoryId: catSelect.value || (ws.categories[0] ? ws.categories[0].id : ''),
      dueDate: dateInput.value,
      notifyEnable: notifySelect.value === 'true',
      completed: false
    };

    ws.tasks.push(newTask);
    saveToStorage();

    titleInput.value = '';
    dateInput.value = '';

    renderFilterTabs();
    renderTasks();
  }

  function deleteTask(id) {
    const ws = getCurrentWorkspace();
    const taskIndex = ws.tasks.findIndex(t => t.id === id);
    if (taskIndex !== -1) {
      const [deletedTask] = ws.tasks.splice(taskIndex, 1);
      appState.trash.push({
        task: deletedTask,
        workspaceId: ws.id,
        deletedAt: Date.now()
      });
      saveToStorage();
      renderFilterTabs();
      renderTasks();
    }
  }

  function openEditTaskModal(id) {
    const ws = getCurrentWorkspace();
    const task = ws.tasks.find(t => t.id === id);
    if (!task) return;

    document.getElementById('editTaskId').value = task.id;
    document.getElementById('editTaskTitle').value = task.title;
    document.getElementById('editTaskDueDate').value = task.dueDate || '';
    document.getElementById('editTaskNotifyEnable').value = (task.notifyEnable !== false && task.notifyEnable !== 'false') ? 'true' : 'false';

    const catSelect = document.getElementById('editTaskCategory');
    catSelect.innerHTML = '';
    ws.categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      if (c.id === task.categoryId) opt.selected = true;
      catSelect.appendChild(opt);
    });

    openModal('editTaskModal');
  }

  function saveTaskEdit() {
    const ws = getCurrentWorkspace();
    const id = document.getElementById('editTaskId').value;
    const task = ws.tasks.find(t => t.id === id);

    if (task) {
      const title = document.getElementById('editTaskTitle').value.trim();
      if (!title) return;

      addTitleToHistory(title);

      task.title = title;
      task.categoryId = document.getElementById('editTaskCategory').value;
      task.dueDate = document.getElementById('editTaskDueDate').value;
      task.notifyEnable = document.getElementById('editTaskNotifyEnable').value === 'true';

      saveToStorage();
      renderFilterTabs();
      renderTasks();
      closeModal('editTaskModal');
    }
  }

  function cleanOldTrash() {
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
    const now = Date.now();
    appState.trash = appState.trash.filter(item => (now - item.deletedAt) < SEVEN_DAYS_MS);
    saveToStorage();
  }

  function openTrashModal() {
    cleanOldTrash();
    const container = document.getElementById('trashList');
    container.innerHTML = '';

    if (appState.trash.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">ゴミ箱は空です（1週間で自動消去されます）</div>';
    } else {
      appState.trash.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'trash-item';
        const deleteDateStr = new Date(item.deletedAt).toLocaleDateString();
        div.innerHTML = `
          <div>
            <div>${escapeHtml(item.task.title)}</div>
            <div class="trash-meta">削除日: ${deleteDateStr}</div>
          </div>
          <button class="btn btn-sm btn-primary" onclick="restoreTrashItem(${index})">復元</button>
        `;
        container.appendChild(div);
      });
    }
    openModal('trashModal');
  }

  function restoreTrashItem(index) {
    const restored = appState.trash.splice(index, 1)[0];
    if (restored) {
      let ws = appState.workspaces[restored.workspaceId] || getCurrentWorkspace();
      ws.tasks.push(restored.task);
      saveToStorage();
      renderFilterTabs();
      renderTasks();
      openTrashModal();
    }
  }

  function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  function checkNotifications() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;

    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    const currentHM = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    Object.values(appState.workspaces).forEach(ws => {
      ws.tasks.forEach(task => {
        if (task.completed || !task.dueDate || task.notifyEnable === false || task.notifyEnable === 'false') return;

        const taskDate = new Date(task.dueDate + 'T00:00:00');
        const todayDate = new Date(todayStr + 'T00:00:00');
        const diffDays = Math.round((taskDate - todayDate) / (1000 * 1000 * 60 * 60 * 24));

        const is3DaysBefore1900 = (diffDays === 3 && currentHM === '19:00');
        const isSameDay0500 = (diffDays === 0 && currentHM === '05:00');

        if (is3DaysBefore1900 || isSameDay0500) {
          const timingText = isSameDay0500 ? '【本日が期限です】' : '【期限3日前です】';
          new Notification(`${timingText} ${task.title}`, {
            body: `期限日: ${task.dueDate}\nタスクを確認・実行しましょう！`
          });
        }
      });
    });
  }

  let tempCategories = [];

  function openCatManageModal() {
    const ws = getCurrentWorkspace();
    tempCategories = JSON.parse(JSON.stringify(ws.categories));
    renderCatEditList();
    openModal('catModal');
  }

  function renderCatEditList() {
    const container = document.getElementById('catEditList');
    container.innerHTML = '';

    tempCategories.forEach((cat, index) => {
      const row = document.createElement('div');
      row.className = 'cat-edit-item';

      let colorOptionsHtml = COLOR_OPTIONS.map(co => `
        <option value="${co.key}" ${co.key === cat.color ? 'selected' : ''}>${co.name}</option>
      `).join('');

      row.innerHTML = `
        <input type="text" value="${escapeHtml(cat.name)}" onchange="tempCategories[${index}].name = this.value.trim()">
        <select style="font-size:0.8rem; padding:4px;" onchange="tempCategories[${index}].color = this.value">
          ${colorOptionsHtml}
        </select>
        <button class="icon-btn" onclick="moveCategory(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.2"' : ''}>
          <span class="icon icon-sm"><svg><use href="#icon-arrow-up"/></svg></span>
        </button>
        <button class="icon-btn" onclick="moveCategory(${index}, 1)" ${index === tempCategories.length - 1 ? 'disabled style="opacity:0.2"' : ''}>
          <span class="icon icon-sm"><svg><use href="#icon-arrow-down"/></svg></span>
        </button>
        <button class="icon-btn" onclick="removeTempCategory(${index})">
          <span class="icon icon-sm"><svg><use href="#icon-trash"/></svg></span>
        </button>
      `;
      container.appendChild(row);
    });
  }

  function addNewCategoryField() {
    tempCategories.push({
      id: 'cat_' + Date.now(),
      name: '新規カテゴリ',
      color: COLOR_OPTIONS[tempCategories.length % COLOR_OPTIONS.length].key
    });
    renderCatEditList();
  }

  function moveCategory(index, direction) {
    const targetIndex = index + direction;
    if (targetIndex < 0 || targetIndex >= tempCategories.length) return;
    const temp = tempCategories[index];
    tempCategories[index] = tempCategories[targetIndex];
    tempCategories[targetIndex] = temp;
    renderCatEditList();
  }

  function removeTempCategory(index) {
    if (tempCategories.length <= 1) {
      alert("カテゴリは最低1つ必要です。");
      return;
    }
    tempCategories.splice(index, 1);
    renderCatEditList();
  }

  function saveCategories() {
    const ws = getCurrentWorkspace();
    ws.categories = JSON.parse(JSON.stringify(tempCategories));

    const validIds = ws.categories.map(c => c.id);
    const defaultCatId = ws.categories[0].id;

    ws.tasks.forEach(task => {
      if (!validIds.includes(task.categoryId)) task.categoryId = defaultCatId;
    });

    saveToStorage();
    renderCategorySelect();
    renderFilterTabs();
    renderTasks();
    closeModal('catModal');
  }

  function openDataModal() {
    document.getElementById('jsonArea').value = JSON.stringify(appState, null, 2);
    openModal('dataModal');
  }

  function copyDataText() {
    const area = document.getElementById('jsonArea');
    area.select();
    document.execCommand('copy');
    alert("バックアップデータをコピーしました！");
  }

  function importDataText() {
    const text = document.getElementById('jsonArea').value.trim();
    if (!text) return;
    try {
      const parsed = JSON.parse(text);
      if (parsed && parsed.workspaces) {
        appState = parsed;
        saveToStorage();
        renderWorkspaceSelect();
        renderCategorySelect();
        renderFilterTabs();
        renderHistoryDatalist();
        renderTasks();
        closeModal('dataModal');
        alert("データを正常に復元・更新しました！");
      }
    } catch(e) {
      alert("データの読み込みに失敗しました。");
    }
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  init();
</script>
</body>
</html>
